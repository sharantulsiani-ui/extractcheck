name: Bug report
description: Report a reproducible failure using synthetic evidence
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Use generated or synthetic evidence only. Do not attach private documents, paths, extracted text, hashes, email or runtime output.
  - type: textarea
    id: problem
    attributes:
      label: What failed?
      description: Say what you ran, what you expected and what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Give the smallest safe commands or generated fixture that reproduces the failure.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, Python version and ExtractCheck version.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no private source material or private-derived evidence.
          required: true
